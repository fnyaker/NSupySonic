services:
  supysonic:
    # Prebuilt multi-arch image from GHCR (default — no local build needed):
    image: ghcr.io/fnyaker/nsupysonic:latest
    # …or build locally instead (also builds the Svelte web UI) by commenting
    # out `image:` above and uncommenting this:
    # build: .
    container_name: supysonic
    restart: unless-stopped
    ports:
      - "5722:5722"
    environment:
      # First-run admin, auto-created on boot (also the Subsonic/web UI login).
      SUPYSONIC_ADMIN_USER: ${SUPYSONIC_ADMIN_USER:-admin}
      SUPYSONIC_ADMIN_PASSWORD: ${SUPYSONIC_ADMIN_PASSWORD:-changeme}
      # Deezer proxy: set DEEZER_ARL to enable it (empty = Deezer disabled).
      DEEZER_ARL: ${DEEZER_ARL:-}
      DEEZER_SYNC_USER: ${SUPYSONIC_ADMIN_USER:-admin}
      DEEZER_QUALITY: ${DEEZER_QUALITY:-FLAC}
      # Auto-sync runs on startup + daily at 04:00 by default; override the time here.
      DEEZER_SYNC_AT: ${DEEZER_SYNC_AT:-}
      # Report what you play back to Deezer so recommendations/Flow keep learning.
      # Off by default (opt-in). Set to "yes" to enable.
      DEEZER_REPORT_LISTENS: ${DEEZER_REPORT_LISTENS:-}
      # Behind a reverse proxy / TLS? Uncomment these to harden:
      #   - PROXY_HOPS = number of trusted proxies in front (enables ProxyFix so
      #     rate-limiting and logs see the real client IP). Only set it if a
      #     proxy you control is really in front.
      #   - COOKIE_SECURE = yes  -> session cookie only sent over HTTPS.
      # SUPYSONIC_PROXY_HOPS: ${SUPYSONIC_PROXY_HOPS:-}
      # SUPYSONIC_SESSION_COOKIE_SECURE: ${SUPYSONIC_SESSION_COOKIE_SECURE:-}
    volumes:
      # Persistent state: sqlite db, caches and the Deezer FLAC archive.
      - supysonic-data:/data
      # Optional: an existing local music library (hybrid with Deezer).
      # - /path/to/your/music:/data/music:ro
      # Optional: a full hand-written config instead of the env vars above.
      # Copy config/supysonic.conf.example to config/supysonic.conf, edit it
      # (it's gitignored — it holds your ARL), then uncomment:
      # - ./config/supysonic.conf:/etc/supysonic:ro

  # Optional background daemon: folder watcher + jukebox. Shares the same env,
  # config and /data volume. Uncomment to enable.
  # supysonic-daemon:
  #   image: ghcr.io/fnyaker/nsupysonic:latest
  #   # build: .
  #   container_name: supysonic-daemon
  #   restart: unless-stopped
  #   command: ["supysonic-daemon"]
  #   environment:
  #     DEEZER_ARL: ${DEEZER_ARL:-}
  #     DEEZER_SYNC_USER: ${SUPYSONIC_ADMIN_USER:-admin}
  #   volumes:
  #     - supysonic-data:/data

volumes:
  supysonic-data:
