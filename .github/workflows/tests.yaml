# Inspired by python-package

name: Tests
on:
  push:
    paths:
    - supysonic/**
    - deezerpy/**
    - tests/**
    - ci-requirements.txt
    - pyproject.toml
    - setup.cfg
    - setup.py
  pull_request:
    paths:
    - supysonic/**
    - deezerpy/**
    - tests/**
    - ci-requirements.txt
    - pyproject.toml
    - setup.cfg
    - setup.py
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ci-requirements.txt
    - name: Run tests
      run: coverage run -m unittest
    - name: Run network tests (non-blocking; depend on third-party services)
      continue-on-error: true
      run: coverage run -a -m unittest tests.net.suite
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      # Don't fail CI when the Codecov token isn't configured on the fork.
      continue-on-error: true
      if: ${{ !cancelled() }}
