name: Docker

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - supysonic/**
      - deezerpy/**
      - webapp/**
      - Dockerfile
      - .dockerignore
      - docker/**
      - setup.cfg
      - setup.py
      - pyproject.toml
      - .github/workflows/docker.yaml
  pull_request:
    paths:
      - supysonic/**
      - deezerpy/**
      - webapp/**
      - Dockerfile
      - .dockerignore
      - docker/**
      - setup.cfg
      - setup.py
      - pyproject.toml
      - .github/workflows/docker.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # buildx exports its layer cache to the GitHub Actions cache service, and
      # that service now requires a writable `actions` scope. Declaring any
      # permissions block sets every unlisted scope to none, so without this the
      # export fails the whole build ("failed to reserve cache" / "cache write
      # denied: token has no writable scopes") *after* the image built fine.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        # Skip login on PRs from forks (no package write access / secrets).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # On a v* tag both this image and the Android APK are built from the
          # same ref, so the tag names the Android release the server should
          # expect its native clients to run.
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only the branch/tag builds publish cache. A PR run writes the SAME
          # key as the push run for the same commit — merge a PR promptly and
          # the two race, and the loser dies with "failed to reserve cache" even
          # though it built the image perfectly. PRs still read the cache.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
