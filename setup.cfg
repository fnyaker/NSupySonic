[metadata]
name = Supysonic
version = attr: supysonic.VERSION
url = https://supysonic.readthedocs.io
download_url = https://github.com/spl0k/supysonic
author = Alban Féron
author_email = alban.feron@gmail.com
license = GNU AGPLv3
license_files = LICENSE

description = Python implementation of the Subsonic server API
long_description =
    Supysonic is a Python implementation of the [Subsonic][] server API.

    Current supported features are:
    * browsing (by folders or tags)
    * streaming of various audio file formats
    * transcoding
    * user or random playlists
    * cover art
    * starred tracks/albums and ratings
    * [Last.FM][lastfm] scrobbling
    * Jukebox mode

    Supysonic currently targets the version 1.10.2 of the Subsonic API. For more
    details, go check the [API implementation status][docs-api].

    [subsonic]: http://www.subsonic.org/
    [lastfm]: https://www.last.fm/
    [docs-api]: https://supysonic.readthedocs.io/en/latest/api.html

long_description_content_type = text/markdown
keywords = subsonic, music, server

classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Environment :: Web Environment
    Framework :: Flask
    Intended Audience :: End Users/Desktop
    Intended Audience :: System Administrators
    License :: OSI Approved :: GNU Affero General Public License v3
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Multimedia :: Sound/Audio

[options]
python_requires = >=3.10
install_requires =
    argon2-cffi >=21.0.0
    click
    flask >=0.11
    peewee
    Pillow >=9.1.0
    # >=2.32 for HTTPAdapter.build_connection_pool_key_attributes, which is how
    # a podcast episode fetch is pinned to the address the SSRF check validated
    # (see supysonic/deezer/provider.py). Older versions still work, minus that.
    requests >=2.32.0
    mediafile
    mutagen
    pycryptodome
    watchdog >=0.8.0
    zipstream-ng >=1.1.0, <2.0.0

packages = find_namespace:
include_package_data = true
zip_safe = false

[options.extras_require]
# Database drivers for the non-default engines (SQLite needs nothing extra).
postgresql =
    psycopg2-binary
mysql =
    PyMySQL

[options.packages.find]
include =
    supysonic*
    deezerpy*

[options.package_data]
# Built Svelte SPA (vite build -> supysonic/webui/dist). Generated, gitignored,
# so it must be listed explicitly to be installed into the package.
supysonic.webui =
    dist/*
    dist/*/*
    dist/*/*/*

[options.entry_points]
console_scripts =
    supysonic-cli = supysonic.cli:main
    supysonic-daemon = supysonic.daemon:main
    supysonic-server = supysonic.server:main
