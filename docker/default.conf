; Default config baked into the image at /etc/supysonic so the container boots
; out of the box (paths under the /data volume). Mounting your own file at
; /etc/supysonic overrides this entirely - see docker/supysonic.conf.example to
; enable the Deezer proxy.

[base]
database_uri = sqlite:////data/db/supysonic.db

[webapp]
cache_dir = /data/cache
cache_size = 512
transcode_cache_size = 2048
log_level = INFO
log_rotate = no

[transcoding]
; Transcode to Opus. In your Subsonic client, request lossless to get the
; original FLAC, or set a bitrate (e.g. 320 / 128 / 64) to get Opus at that rate.
transcoder_flac_opus = ffmpeg -i %srcpath -v 0 -map 0:a:0 -c:a libopus -b:a %outratek -vbr on -f ogg -
transcoder_mp3_opus = ffmpeg -i %srcpath -v 0 -map 0:a:0 -c:a libopus -b:a %outratek -vbr on -f ogg -
transcoder = ffmpeg -i %srcpath -ab %outratek -v 0 -f %outfmt -
default_transcode_target = opus

[mimetypes]
opus = audio/ogg

[daemon]
socket = /data/supysonic.sock
log_level = INFO
log_rotate = no

[deezer]
enabled = no
archive_dir = /data/archive
