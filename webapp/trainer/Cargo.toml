[package]
name = "trainer"
version = "0.1.0"
edition = "2021"
description = "NSupySonic's genre-studio trainer: the heads trained on the frozen embedding, cross-validated and calibrated, for the page."
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# No dependencies, like the rhythm analyser and the app core next door: the
# Docker image builds this with nothing but the toolchain.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 3
