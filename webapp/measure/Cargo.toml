[package]
name = "measure"
version = "0.1.0"
edition = "2021"
description = "NSupySonic's whole-track measures (spectral descriptors, EBU R128 loudness) for analysis on the client PC. WIP: see docs/claude/client-analysis.md."
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# No dependencies, like the rhythm analyser, the app core and the trainer.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 3
